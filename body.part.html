<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---- tokens: one committed world, the hall during a performance ---- */
  :root{
    --ground:#131110;
    --ground-2:#1A1715;
    --surface:#1C1917;
    --paper:#EFE9E0;
    --muted:#9C9188;
    --faint:#6E655D;
    --rule:#2E2924;
    --varnish:#C68A42;
    --varnish-dim:#8A6230;

    --f-display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
    --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
    --f-data:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;

    --measure:63ch;
    --rail:6.5rem;
    --pad:clamp(1.25rem,5vw,4rem);
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--paper);
    font-family:var(--f-body);
    font-size:clamp(15px,0.55vw + 13.4px,17px);
    line-height:1.65;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}
  [hidden]{display:none!important}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--varnish);outline-offset:3px;border-radius:2px}

  .wrap{max-width:66rem;margin:0 auto;padding-inline:var(--pad)}

  /* ---- language switcher ---- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(19,17,16,0.92);
    background:color-mix(in srgb,var(--ground) 88%,transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--rule);
  }
  .topbar-in{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    max-width:66rem;margin:0 auto;padding:0.7rem var(--pad);
  }
  .sigil{
    font-family:var(--f-display);font-size:0.95rem;letter-spacing:0.02em;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .langs{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:2px;flex:none}
  .langs button{
    appearance:none;border:0;cursor:pointer;
    background:var(--ground);color:var(--muted);
    font-family:var(--f-data);font-size:0.7rem;font-weight:500;
    letter-spacing:0.09em;padding:0.42rem 0.7rem;
    transition:color .18s ease,background .18s ease;
  }
  .langs button:hover{color:var(--paper)}
  .langs button[aria-pressed="true"]{background:var(--varnish);color:#17130E}

  /* ---- hero ---- */
  .hero{padding-block:clamp(2.5rem,7vw,5.5rem) clamp(2.5rem,6vw,4.5rem)}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(1.75rem,4vw,3.25rem);align-items:end}
  @media (min-width:820px){ .hero-grid{grid-template-columns:15.5rem minmax(0,1fr)} }

  .portrait{
    position:relative;border:1px solid var(--rule);background:var(--ground-2);
    max-width:15.5rem;
  }
  .portrait img{width:100%;height:auto;filter:contrast(1.06) brightness(0.97)}
  .portrait figcaption{
    font-family:var(--f-data);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--faint);padding:0.5rem 0.6rem;border-top:1px solid var(--rule);
  }

  .eyebrow{
    font-family:var(--f-data);font-size:0.68rem;font-weight:500;
    letter-spacing:0.22em;text-transform:uppercase;color:var(--varnish);
    margin:0 0 1rem;
  }
  h1{
    font-family:var(--f-display);font-weight:400;
    font-size:clamp(2.35rem,7.2vw,4.6rem);
    line-height:0.98;letter-spacing:-0.012em;
    margin:0;text-wrap:balance;
  }
  h1 .sur{display:block;font-style:italic;font-weight:400}
  .lead{
    font-family:var(--f-display);font-style:italic;
    font-size:clamp(1.05rem,1.9vw,1.3rem);line-height:1.45;
    color:var(--paper);margin:1.4rem 0 0;max-width:34ch;
  }
  .roles{
    margin:1.5rem 0 0;padding:0;list-style:none;
    display:flex;flex-wrap:wrap;gap:0.35rem 1.1rem;
    font-size:0.83rem;color:var(--muted);max-width:52ch;
  }
  .roles li{position:relative;padding-left:0.85rem}
  .roles li::before{
    content:"";position:absolute;left:0;top:0.62em;
    width:3px;height:3px;border-radius:50%;background:var(--varnish-dim);
  }

  /* ---- the four strings: G D A E, tuned in fifths ---- */
  .strings{margin-top:clamp(2.25rem,5vw,3.25rem);display:grid;gap:0.72rem}
  .string{display:grid;grid-template-columns:1.35rem 1fr;align-items:center;gap:0.75rem}
  .string span{
    font-family:var(--f-data);font-size:0.6rem;letter-spacing:0.08em;
    color:var(--faint);
  }
  .string i{
    display:block;background:linear-gradient(90deg,var(--rule),#4A4239 45%,var(--rule));
    transform-origin:center;
  }
  .string:nth-child(1) i{height:2.4px}
  .string:nth-child(2) i{height:1.9px}
  .string:nth-child(3) i{height:1.4px}
  .string:nth-child(4) i{height:1px}
  @media (prefers-reduced-motion:no-preference){
    .string i{animation:bow 7s ease-in-out infinite}
    .string:nth-child(1) i{animation-delay:0s}
    .string:nth-child(2) i{animation-delay:.45s}
    .string:nth-child(3) i{animation-delay:.9s}
    .string:nth-child(4) i{animation-delay:1.35s}
  }
  @keyframes bow{
    0%,72%,100%{transform:scaleY(1);opacity:.8}
    76%{transform:scaleY(2.6);opacity:1}
    82%{transform:scaleY(1.5);opacity:.95}
    88%{transform:scaleY(1.15);opacity:.85}
  }

  /* ---- sections ---- */
  section{padding-block:clamp(2.75rem,6vw,4.5rem);border-top:1px solid var(--rule)}
  .sec-head{
    display:flex;align-items:baseline;gap:1rem;
    margin:0 0 clamp(1.5rem,3vw,2.25rem);
  }
  .sec-head h2{
    font-family:var(--f-display);font-weight:400;
    font-size:clamp(1.5rem,3.1vw,2.05rem);line-height:1.1;
    margin:0;letter-spacing:-0.005em;text-wrap:balance;
  }
  .sec-head .n{
    font-family:var(--f-data);font-size:0.66rem;letter-spacing:0.14em;
    color:var(--varnish);flex:none;padding-top:0.15em;
  }

  .prose{max-width:var(--measure)}
  .prose p{margin:0 0 1.15em}
  .prose p:last-child{margin-bottom:0}
  .prose p.first{
    font-size:1.1em;color:var(--paper);
  }
  .prose p{color:var(--muted)}
  .prose strong{color:var(--paper);font-weight:500}

  /* ---- year rail: the spine of a chronology ---- */
  .rail{display:grid;gap:0}
  .entry{
    display:grid;grid-template-columns:var(--rail) minmax(0,1fr);
    gap:0 clamp(1rem,2.5vw,2rem);
    padding-block:1.1rem;
    border-top:1px solid var(--rule);
  }
  .entry:first-child{border-top:0;padding-top:0}
  .entry .yr{
    font-family:var(--f-data);font-size:0.74rem;font-weight:500;
    font-variant-numeric:tabular-nums;letter-spacing:0.01em;
    color:var(--varnish);padding-top:0.28em;white-space:nowrap;
  }
  .entry .yr.open{color:var(--paper)}
  .entry h3{
    font-family:var(--f-body);font-weight:500;font-size:1rem;
    margin:0;line-height:1.4;color:var(--paper);
  }
  .entry p{margin:0.3rem 0 0;color:var(--muted);font-size:0.92rem;max-width:58ch}
  .entry .tag{
    display:inline-block;margin-top:0.55rem;
    font-family:var(--f-data);font-size:0.62rem;letter-spacing:0.11em;
    text-transform:uppercase;color:var(--varnish);
    border:1px solid var(--varnish-dim);border-radius:2px;padding:0.18rem 0.44rem;
  }
  @media (max-width:560px){
    .entry{grid-template-columns:minmax(0,1fr);gap:0.4rem}
    .entry .yr{padding-top:0}
  }

  /* ---- name lists ---- */
  .block{margin-top:clamp(2rem,4vw,2.75rem)}
  .block:first-child{margin-top:0}
  .label{
    font-family:var(--f-data);font-size:0.66rem;font-weight:500;
    letter-spacing:0.16em;text-transform:uppercase;color:var(--faint);
    margin:0 0 0.9rem;
  }
  .names{
    margin:0;padding:0;list-style:none;
    display:flex;flex-wrap:wrap;gap:0.3rem 0;
    max-width:62rem;
  }
  .names li{font-size:0.94rem;color:var(--paper);padding-right:0.9rem;margin-right:0.9rem;position:relative}
  .names li::after{
    content:"";position:absolute;right:0;top:0.62em;
    width:3px;height:3px;border-radius:50%;background:var(--varnish-dim);
  }
  .names li:last-child::after{display:none}
  .names li small{color:var(--muted);font-size:0.85em}

  /* ---- academy: the one raised object on the page ---- */
  .featured{
    background:var(--surface);border:1px solid var(--rule);
    border-left:2px solid var(--varnish);
    padding:clamp(1.4rem,3.4vw,2.2rem);
    display:grid;gap:0.8rem;
  }
  .featured .yr{
    font-family:var(--f-data);font-size:0.72rem;font-weight:500;
    letter-spacing:0.08em;color:var(--varnish);
  }
  .featured h3{
    font-family:var(--f-display);font-weight:400;font-size:clamp(1.35rem,2.7vw,1.8rem);
    margin:0;line-height:1.15;letter-spacing:-0.005em;
  }
  .featured p{margin:0;color:var(--muted);max-width:52ch}

  .featured-pair{display:grid;gap:1px;background:var(--rule)}
  @media (min-width:760px){ .featured-pair{grid-template-columns:1fr 1fr} }
  .featured-pair .featured{border-left-width:2px;height:100%}

  /* ---- footer ---- */
  footer{border-top:1px solid var(--rule);padding-block:clamp(2.5rem,5vw,3.5rem) 3rem}
  .site-link{
    font-family:var(--f-display);font-size:clamp(1.5rem,4vw,2.4rem);
    text-decoration:none;color:var(--paper);
    border-bottom:1px solid var(--varnish-dim);
    padding-bottom:0.1em;transition:color .2s ease,border-color .2s ease;
    display:inline-block;
  }
  .site-link:hover{color:var(--varnish);border-color:var(--varnish)}
  .footer-mail{margin:1.35rem 0 0;font-size:0.95rem}
  .footer-mail a{
    color:var(--muted);text-decoration:none;
    border-bottom:1px solid var(--rule);padding-bottom:0.08em;
    transition:color .2s ease,border-color .2s ease;
  }
  .footer-mail a:hover{color:var(--varnish);border-color:var(--varnish-dim)}
  .colophon{
    margin-top:2.25rem;font-family:var(--f-data);font-size:0.66rem;
    letter-spacing:0.06em;color:var(--faint);line-height:1.8;
  }

  /* ---- enquiry form ---- */
  .form-intro{max-width:52ch;color:var(--muted);margin:0 0 1.75rem}

  .purpose{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:0 0 1.75rem;width:fit-content;max-width:100%}
  .purpose button{
    appearance:none;border:0;cursor:pointer;background:var(--ground);color:var(--muted);
    font-family:var(--f-body);font-size:0.88rem;padding:0.6rem 1.1rem;
    transition:color .18s ease,background .18s ease;
  }
  .purpose button:hover{color:var(--paper)}
  .purpose button[aria-pressed="true"]{background:var(--varnish);color:#17130E;font-weight:500}

  .fields{display:grid;gap:1.15rem;max-width:38rem}
  @media (min-width:640px){ .fields .row2{display:grid;grid-template-columns:1fr 1fr;gap:1.15rem} }
  .field{display:grid;gap:0.4rem;min-width:0}
  .field label{
    font-family:var(--f-data);font-size:0.64rem;font-weight:500;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);
  }
  .field input,.field textarea{
    font-family:var(--f-body);font-size:0.95rem;color:var(--paper);
    background:var(--ground-2);border:1px solid var(--rule);border-radius:0;
    padding:0.68rem 0.8rem;width:100%;
    transition:border-color .18s ease;
  }
  .field textarea{min-height:8.5rem;resize:vertical;line-height:1.6}
  .field input:hover,.field textarea:hover{border-color:#3C3630}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--varnish)}
  .field input::placeholder,.field textarea::placeholder{color:#5D554E}
  .field[data-invalid="true"] input,.field[data-invalid="true"] textarea{border-color:#B4553C}
  .field .err{font-size:0.8rem;color:#D97A5E;min-height:0}
  .field .err:empty{display:none}

  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  .form-actions{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:0.5rem}
  .submit{
    appearance:none;cursor:pointer;
    background:var(--varnish);color:#17130E;border:1px solid var(--varnish);
    font-family:var(--f-body);font-weight:600;font-size:0.9rem;
    letter-spacing:0.01em;padding:0.72rem 1.5rem;
    transition:background .18s ease,border-color .18s ease;
  }
  .submit:hover{background:#D89B52;border-color:#D89B52}
  .form-note{font-size:0.82rem;color:var(--muted);max-width:34ch}
  .form-status{
    margin-top:1.25rem;padding:0.85rem 1rem;max-width:38rem;
    border-left:2px solid var(--varnish);background:var(--surface);
    font-size:0.9rem;color:var(--paper);
  }
  .form-status[hidden]{display:none}
  .setup-note{
    margin-top:1rem;font-family:var(--f-data);font-size:0.68rem;
    letter-spacing:0.04em;color:var(--varnish);max-width:44ch;line-height:1.7;
  }
</style>

  <div class="topbar-in">

  </div>
</header>

  var STRINGS = [

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function entry(e){
    return '<div class="entry">' +
      '<div class="yr' + (e.open ? " open" : "") + '">' + esc(e.yr) + '</div>' +
      '<div><h3>' + esc(e.h) + '</h3>' +
      (e.p ? '<p>' + esc(e.p) + '</p>' : '') +
      (e.tag ? '<span class="tag">' + esc(e.tag) + '</span>' : '') +
      '</div></div>';
  }

  function nameList(items){
    return '<ul class="names">' + items.map(function(it){
      if (typeof it === "string") return '<li>' + esc(it) + '</li>';
      return '<li>' + esc(it.n) + ' <small>' + esc(it.y) + '</small></li>';
    }).join("") + '</ul>';
  }

  function sectionHead(s){
    return '<div class="sec-head"><span class="n">' + esc(s.n) + '</span><h2>' + esc(s.t) + '</h2></div>';
  }


  function formSection(d){
    var f = d.form;
    var opts = f.purposes.map(function(o,i){
      return '<button type="button" data-purpose="' + o.id + '" aria-pressed="' +
             (i===0 ? "true" : "false") + '">' + esc(o.label) + '</button>';
    }).join("");

    return '<section id="enquiry">' + sectionHead(d.sections.enquiry) +
      '<p class="form-intro">' + esc(f.intro) + '</p>' +
      '<div class="purpose" role="group" id="purpose">' + opts + '</div>' +
      '<form class="fields" id="enquiry-form" novalidate>' +
        '<div class="row2">' +
          '<div class="field" data-for="name">' +
            '<label for="q-name">' + esc(f.name) + '</label>' +
            '<input id="q-name" name="name" type="text" autocomplete="name" placeholder="' + esc(f.namePh) + '">' +
            '<p class="err"></p>' +
          '</div>' +
          '<div class="field" data-for="email">' +
            '<label for="q-email">' + esc(f.email) + '</label>' +
            '<input id="q-email" name="email" type="email" autocomplete="email" placeholder="' + esc(f.emailPh) + '">' +
            '<p class="err"></p>' +
          '</div>' +
        '</div>' +
        '<div class="field" data-for="place">' +
          '<label for="q-place">' + esc(f.place) + '</label>' +
          '<input id="q-place" name="place" type="text" placeholder="' + esc(f.placePh) + '">' +
        '</div>' +
        '<div class="field" data-for="message">' +
          '<label for="q-message">' + esc(f.message) + '</label>' +
          '<textarea id="q-message" name="message" placeholder="' + esc(f.messagePh.studies) + '"></textarea>' +
          '<p class="err"></p>' +
        '</div>' +
        '<div class="hp" aria-hidden="true">' +
          '<label for="q-website">Website</label>' +
          '<input id="q-website" name="website" type="text" tabindex="-1" autocomplete="off">' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="submit" type="submit">' + esc(f.submit) + '</button>' +
          '<span class="form-note">' + esc(f.note) + '</span>' +
        '</div>' +
      '</form>' +
      '<p class="form-status" id="form-status" hidden></p>' +
      (!IS_LOCAL || CONTACT_EMAIL || FORM_ENDPOINT ? '' : '<p class="setup-note">' + esc(f.setup) + '</p>') +
      '</section>';
  }

  function wireForm(d){
    var f = d.form;
    var form = document.getElementById("enquiry-form");
    if (!form) return;

    var purpose = f.purposes[0].id;
    var msg = document.getElementById("q-message");
    var status = document.getElementById("form-status");

    document.getElementById("purpose").addEventListener("click", function(ev){
      var b = ev.target.closest("button[data-purpose]");
      if (!b) return;
      purpose = b.getAttribute("data-purpose");
      var all = this.querySelectorAll("button[data-purpose]");
      for (var i = 0; i < all.length; i++){
        all[i].setAttribute("aria-pressed", all[i] === b ? "true" : "false");
      }
      msg.placeholder = f.messagePh[purpose] || "";
    });

    function setErr(name, text){
      var wrap = form.querySelector('.field[data-for="' + name + '"]');
      if (!wrap) return;
      wrap.setAttribute("data-invalid", text ? "true" : "false");
      var el = wrap.querySelector(".err");
      if (el) el.textContent = text || "";
    }

    function show(text){
      status.textContent = text;
      status.hidden = false;
    }

    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      /* form.name grąžintų formos atributą, ne lauką — imame per elements */
      var el = form.elements;
      if (el["website"].value) return;           /* spam bot užpildė paslėptą lauką */

      var name = el["name"].value.trim();
      var email = el["email"].value.trim();
      var place = el["place"].value.trim();
      var text = el["message"].value.trim();
      var bad = null;

      setErr("name", name ? "" : (bad = bad || "name", f.errName));
      setErr("email", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "" : (bad = bad || "email", f.errEmail));
      setErr("message", text.length >= 20 ? "" : (bad = bad || "message", f.errMessage));
      if (bad){
        var first = form.querySelector('.field[data-invalid="true"] input, .field[data-invalid="true"] textarea');
        if (first) first.focus();
        return;
      }

      var subject = f.subject[purpose];
      var body = [
        f.name + ": " + name,
        f.email + ": " + email,
        place ? f.place + ": " + place : "",
        "",
        text
      ].filter(Boolean).join("\n");

      if (FORM_ENDPOINT){
        show(f.sending);
        fetch(FORM_ENDPOINT, {
          method:"POST",
          headers:{"Accept":"application/json","Content-Type":"application/json"},
          body: JSON.stringify({ purpose:purpose, subject:subject, name:name, email:email, place:place, message:text })
        }).then(function(r){
          if (!r.ok) throw new Error("http " + r.status);
          form.reset();
          show(f.okPost);
        }).catch(function(){
          show(f.failPost);
        });
        return;
      }

      if (CONTACT_EMAIL){
        window.location.href = "mailto:" + CONTACT_EMAIL +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);
        show(f.okMail);
        return;
      }

      show(IS_LOCAL ? f.setup : f.failPost);
    });
  }

    var html = '';

      '<div>' +
        '<p class="eyebrow">' + esc(d.eyebrow) + '</p>' +

      '</div>' +
    '</div><div class="strings" aria-hidden="true">' + strings + '</div></div>';

    /* I. bio */
    html += '<section>' + sectionHead(d.sections.bio) +
      '<div class="prose">' +
      d.bio.map(function(p,i){ return '<p' + (i===0 ? ' class="first"' : '') + '>' + p + '</p>'; }).join("") +
      '</div></section>';

    /* II. formation */
    html += '<section>' + sectionHead(d.sections.formation) +
      '<div class="rail">' + d.formation.map(entry).join("") + '</div>' +
      '<div class="block"><p class="label">' + esc(d.mastersLabel) + '</p>' + nameList(d.masters) + '</div>' +
      '</section>';

    /* III. awards */
    html += '<section>' + sectionHead(d.sections.awards) +
      '<div class="rail">' + d.awards.map(entry).join("") + '</div>' +
      '<div class="block"><p class="label">' + esc(d.scholarLabel) + '</p>' + nameList(d.scholarships) + '</div>' +
      '</section>';

    /* IV. stage */
    html += '<section>' + sectionHead(d.sections.stage) +
      '<div class="block"><p class="label">' + esc(d.orchLabel) + '</p>' + nameList(d.orchestras) + '</div>' +
      '<div class="block"><p class="label">' + esc(d.partLabel) + '</p>' + nameList(d.partners) + '</div>' +
      '<div class="block"><p class="label">' + esc(d.venueLabel) + '</p>' + nameList(d.venues) + '</div>' +
      '<div class="block"><p class="label">' + esc(d.archLabel) + '</p>' + nameList(d.archives) + '</div>' +
      '</section>';

    /* V. discography */
    html += '<section>' + sectionHead(d.sections.disco) +
      '<div class="rail">' + d.disco.map(entry).join("") + '</div></section>';

    /* VI. teaching */
    html += '<section>' + sectionHead(d.sections.teaching) +
      '<div class="rail">' + d.teaching.map(entry).join("") + '</div>' +
      '<div class="block featured-pair">' +
        [d.academy, d.festival].map(function(f){
          return '<div class="featured">' +
            '<span class="yr">' + esc(f.yr) + '</span>' +
            '<h3>' + esc(f.h) + '</h3>' +
            '<p>' + esc(f.p) + '</p>' +
          '</div>';
        }).join("") +
      '</div></section>';

    /* VI. enquiry */
    html += formSection(d);

    /* footer */
    html += '<footer>' +
      '<a class="site-link" href="https://www.vonbekker.com" target="_blank" rel="noopener noreferrer">vonbekker.com</a>' +
      (CONTACT_EMAIL ? '<p class="footer-mail"><a href="mailto:' + CONTACT_EMAIL + '">' + CONTACT_EMAIL + '</a></p>' : '') +
      '<p class="colophon">' + esc(d.footerCta) + '<br><br>' + d.colophon + '</p>' +
      '</footer>';

    document.getElementById("main").innerHTML = html;
    document.documentElement.lang = d.htmlLang;
    wireForm(d);

    var btns = document.querySelectorAll("#langs button");
    for (var i = 0; i < btns.length; i++){
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-lang") === lang ? "true" : "false");
    }
    try { localStorage.setItem("mvb-lang", lang); } catch(e){}
  }

  function initialLang(){
    try {
      var saved = localStorage.getItem("mvb-lang");
      if (saved && C[saved]) return saved;
    } catch(e){}
    var nav = (navigator.language || "").slice(0,2).toLowerCase();
    if (C[nav]) return nav;
    return "lt";
  }

  document.getElementById("langs").addEventListener("click", function(ev){
    var b = ev.target.closest("button[data-lang]");
    if (b) render(b.getAttribute("data-lang"));
  });

  render(initialLang());
})();
